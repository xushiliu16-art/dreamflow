<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreamFlow</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
    body{display:flex;background:#f5f7fb;color:#222}
    .sidebar{width:240px;height:100vh;background:#111827;color:white;padding:30px}
    .logo{font-size:28px;font-weight:bold;margin-bottom:40px;color:#60a5fa}
    .menu-item{padding:14px;margin-bottom:12px;border-radius:10px;cursor:pointer}
    .menu-item:hover{background:#1f2937}
    .main{flex:1;padding:40px}
    .card{background:white;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
    input,textarea{width:100%;padding:12px;margin-top:10px;border:1px solid #ddd;border-radius:8px}
    button{background:#2563eb;color:white;border:none;padding:12px 18px;border-radius:8px;cursor:pointer;margin-top:12px}
    .hidden{display:none}
    .dream-item{border-bottom:1px solid #eee;padding:12px 0}
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">DreamFlow</div>
    <div class="menu-item" onclick="showPage('dashboard')">首页</div>
    <div class="menu-item" onclick="showPage('dreams')">梦境记录</div>
    <div class="menu-item" onclick="logout()">退出登录</div>
  </div>

  <div class="main">
    <div id="authPage">
      <div class="card">
        <h2>注册 / 登录</h2>
        <input id="email" placeholder="邮箱" />
        <input id="password" type="password" placeholder="密码" />
        <button onclick="register()">注册</button>
        <button onclick="login()">登录</button>
      </div>
    </div>

    <div id="appPage" class="hidden">
      <div id="dashboard" class="page">
        <div class="card">
          <h2>欢迎回来</h2>
          <p>你的专属梦境空间。</p>
        </div>
      </div>

      <div id="dreams" class="page hidden">
        <div class="card">
          <h2>记录梦境</h2>
          <input id="dreamTitle" placeholder="梦境标题" />
          <textarea id="dreamContent" rows="6" placeholder="写下你的梦..."></textarea>
          <button onclick="saveDream()">保存梦境</button>
        </div>

        <div class="card">
          <h2>我的梦境</h2>
          <div id="dreamList"></div>
        </div>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmbW9vYnJ3eHR3cmJ2d3BsdWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTQ4MDMsImV4cCI6MjA5NDI3MDgwM30.WDaaM7X753vnmVomMvUi9YLbms7BycE-PdDKLtWQUyQ';
const SUPABASE_ANON_KEY = 'https://vfmoobrwxtwrbvwpplugy.supabase.co';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

async function register(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const {error} = await client.auth.signUp({email,password});
  alert(error ? error.message : '注册成功，请登录邮箱验证');
}

async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const {error} = await client.auth.signInWithPassword({email,password});
  if(error) return alert(error.message);
  enterApp();
}

async function logout(){
  await client.auth.signOut();
  location.reload();
}

async function enterApp(){
  document.getElementById('authPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  loadDreams();
}

async function saveDream(){
  const user = (await client.auth.getUser()).data.user;
  const title = document.getElementById('dreamTitle').value;
  const content = document.getElementById('dreamContent').value;

  const {error} = await client.from('dreams').insert({
    user_id:user.id,
    title,
    content
  });

  if(error) return alert(error.message);
  alert('保存成功');
  loadDreams();
}

async function loadDreams(){
  const user = (await client.auth.getUser()).data.user;

  const {data} = await client
    .from('dreams')
    .select('*')
    .eq('user_id', user.id)
    .order('created_at',{ascending:false});

  const list = document.getElementById('dreamList');
  list.innerHTML = '';

  data?.forEach(item=>{
    list.innerHTML += `
      <div class="dream-item">
        <h4>${item.title}</h4>
        <p>${item.content}</p>
      </div>
    `;
  })
}

client.auth.getSession().then(({data})=>{
  if(data.session) enterApp();
});
</script>
</body>
</html>
