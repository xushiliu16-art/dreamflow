<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamFlow</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",sans-serif;
}

body{
background:#f5f7fb;
}

.app{
display:flex;
height:100vh;
}

/* 左侧导航 */
.sidebar{
width:240px;
background:white;
border-right:1px solid #e5e7eb;
padding:30px 20px;
}

.logo{
font-size:28px;
font-weight:bold;
color:#3b82f6;
margin-bottom:40px;
}

.menu-item{
padding:15px;
margin-bottom:10px;
border-radius:12px;
cursor:pointer;
transition:.2s;
}

.menu-item:hover{
background:#eff6ff;
}

.active{
background:#dbeafe;
color:#2563eb;
font-weight:bold;
}

/* 主区域 */
.main{
flex:1;
padding:40px;
overflow-y:auto;
}

.page{
display:none;
}

.active-page{
display:block;
}

.title{
font-size:32px;
font-weight:bold;
margin-bottom:30px;
color:#1e293b;
}

.card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 4px 12px rgba(0,0,0,.04);
margin-bottom:25px;
}

input,textarea{
width:100%;
padding:15px;
border:1px solid #dbeafe;
border-radius:12px;
margin-bottom:15px;
font-size:16px;
}

textarea{
height:180px;
resize:none;
}

button{
padding:14px 25px;
border:none;
border-radius:12px;
background:#3b82f6;
color:white;
cursor:pointer;
font-size:16px;
}

.preview-img{
margin-top:20px;
max-width:300px;
border-radius:12px;
display:none;
}
</style>
</head>

<body>

<div class="app">

<!-- 左侧导航 -->
<div class="sidebar">

<div class="logo">
DreamFlow
</div>

<div class="menu-item active" onclick="switchPage('home',this)">
首页
</div>

<div class="menu-item" onclick="switchPage('record',this)">
记录梦境
</div>

<div class="menu-item" onclick="switchPage('ai',this)">
AI解析
</div>

<div class="menu-item" onclick="switchPage('community',this)">
梦境社区
</div>

<div class="menu-item" onclick="switchPage('profile',this)">
我的
</div>

</div>

<!-- 主区域 -->
<div class="main">

<!-- 首页 -->
<div class="page active-page" id="home">

<div class="title">
欢迎回来
</div>

<div class="card">
你已经记录了 <b>21</b> 个梦境。
</div>

<div class="card">
连续记录：<b>7天</b>
</div>

</div>


<!-- 记录页 -->
<div class="page" id="record">

<div class="title">
记录梦境
</div>

<div class="card">

<input id="dreamTitle" placeholder="请输入梦境标题">

<textarea id="dreamContent" placeholder="今天梦到了什么？"></textarea>

<input type="file" id="uploadImage">

<img id="preview" class="preview-img">

<br><br>

<button onclick="saveDream()">
保存梦境
</button>

</div>

</div>


<!-- AI -->
<div class="page" id="ai">

<div class="title">
AI解梦
</div>

<div class="card">
输入梦境后，这里未来会接入 AI 分析。
</div>

</div>


<!-- 社区 -->
<div class="page" id="community">

<div class="title">
梦境社区
</div>

<div class="card">
👻 昨晚梦到了童年的学校...
</div>

<div class="card">
🌌 梦见自己在宇宙漂浮...
</div>

</div>


<!-- 我的 -->
<div class="page" id="profile">

<div class="title">
我的数据
</div>

<div class="card">
总记录：21
</div>

<div class="card">
AI分析：15次
</div>

</div>

</div>

</div>

<script>

function switchPage(pageId,element){

document.querySelectorAll('.page').forEach(page=>{
page.classList.remove('active-page')
});

document.getElementById(pageId).classList.add('active-page');

document.querySelectorAll('.menu-item').forEach(item=>{
item.classList.remove('active')
});

element.classList.add('active');

}

/* 图片上传预览 */
document.getElementById("uploadImage").addEventListener("change",function(e){

const file=e.target.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(event){

const preview=document.getElementById("preview");

preview.src=event.target.result;

preview.style.display="block";

}

reader.readAsDataURL(file);

}

});


/* 本地保存 */
function saveDream(){

const title=document.getElementById("dreamTitle").value;

const content=document.getElementById("dreamContent").value;

localStorage.setItem("dreamTitle",title);

localStorage.setItem("dreamContent",content);

alert("保存成功！");

}

</script>

</body>
</html>
